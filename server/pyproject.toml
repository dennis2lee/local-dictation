[project]
name = "local-dictation-server"
version = "0.1.4"
description = "Offline Korean/English dictation server (Whisper large-v3, CPU INT8)"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The inference backend is optional so the protocol, streaming and API layers can
# be installed, imported and tested on machines without the model toolchain.
inference = [
    "faster-whisper>=1.0.3",
    "ctranslate2>=4.3",
]
# Silero VAD through onnxruntime. Without it the server falls back to the
# energy-based detector in app/streaming/vad.py.
vad = [
    "onnxruntime>=1.18",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "jsonschema>=4.22",
    "websockets>=12.0",
]

[project.scripts]
local-dictation-serve = "app.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
