name: Test

# Every push and pull request. The release workflow runs the same suites before
# it builds anything, but finding out at tag time that main was broken a week
# ago is finding out too late.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the server claims to support, and the newest that
        # its dependencies have wheels for.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        working-directory: server
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -e '.[dev]'
      - name: Test
        working-directory: server
        run: .venv/bin/python -m pytest -q
      - name: Shipped configs validate
        working-directory: server
        # --check-config, not --check. The second one asks whether this machine
        # could serve the config — whether the model is installed and the TLS
        # keypair is readable — which on a runner is a question that can only be
        # answered no. What is being tested here is the file.
        run: |
          .venv/bin/python -m app.main --config config/server-ko.yaml --check-config
          .venv/bin/python -m app.main --config config/server-en.yaml --check-config

  client:
    name: Client (Go)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
          # The caches are handled below instead. setup-go writes one only when
          # its own key misses, so the first run under a given go.sum freezes
          # the contents until the dependencies change — and once frozen, no
          # later change to how anything is compiled ever reaches it.
          cache: false
      - name: Locate the Go caches
        shell: bash
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
      - name: Go caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          # Rewritten whenever the client changes, restored from the newest
          # cache for these dependencies otherwise. The release workflow reads
          # these by the same prefix: a run on a tag can only restore caches
          # written on the default branch, so this job is the one place a
          # release build's cache can come from.
          key: go-${{ runner.os }}-${{ hashFiles('client/go.sum') }}-${{ hashFiles('client/**/*.go') }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('client/go.sum') }}-
      - name: Linux GUI headers
        if: runner.os == 'Linux'
        # Fyne pulls in glfw, which compiles against X11 and Wayland both.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgl1-mesa-dev xorg-dev libasound2-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols
      - name: PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        # Nothing else ever reads these. build-msi.ps1 at least runs during a
        # release; fetch-model.ps1 is handed to a user on a Windows machine and
        # a syntax error in it would surface there and nowhere earlier.
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { Write-Host "$($_.FullName):"; $errors | ForEach-Object { Write-Host "  $_" }; $failed = $true }
            else { Write-Host "ok  $($_.Name)" }
          }
          if ($failed) { exit 1 }
      - name: Vet
        working-directory: client
        run: go vet ./...
      - name: Test
        working-directory: client
        run: go test -race ./...
      - name: Build
        working-directory: client
        # -trimpath because the release builds with it. It goes into every
        # package's build ID, so a cache warmed without it is a cache a release
        # cannot use — and that one flag was six minutes of every release,
        # spent compiling Fyne, glfw and miniaudio again on a Windows runner
        # that had just restored 200 MB of unusable objects.
        run: go build -trimpath ./cmd/...

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: client/go.mod }
      - name: gofmt
        working-directory: client
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: Shell scripts parse
        # find, not a ** glob: bash does not enable globstar by default, so the
        # pattern would silently match nothing and the check would always pass.
        run: |
          find build server/scripts -type f \( -name '*.sh' -o -name 'local-dictation-server' \) \
            -print -exec bash -n {} \;

  protocol:
    name: Protocol schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Schemas are valid and the bindings match them
        working-directory: server
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -e '.[dev]'
          .venv/bin/python -m pytest tests/test_protocol.py -q
